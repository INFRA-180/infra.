name: Deploy public site

on:
  push:
    branches:
      - codex/beta-site
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify public boundary
        run: node tools/verify-public-boundary.js
      - name: Verify audio runtime
        run: |
          node tools/test-audio-runtime.js
          node tools/test-audio-prefetch-sw.js
          node tools/verify-audio-release.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
