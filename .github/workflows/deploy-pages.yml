name: Deploy public site

on:
  push:
    branches:
      - codex/beta-site
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Outils de vérification (Vite, ESLint…) aux versions exactes de package-lock.json (INFRA, 11/11/2026).
      # Ils servent seulement à l'audit : le site publié (public/, app.js déjà construit) n'en dépend pas.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install build tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit release
        run: node tools/release-audit.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
